% TeX4ht configuration of the web edition, used by html/build.sh:
%   make4ht -l -j index -c html/edm.cfg -e html/build.mk4 web.tex "..."
% It only changes how the book is rendered as HTML: main.tex and the chapters are not touched.
\Preamble{xhtml}

% ------------------------------------------------------------------ <head>
\Configure{@HEAD}{\HCode{<meta name="viewport" content="width=device-width, initial-scale=1" />\Hnewline}}
\Configure{AddCss}{edm.css}
\Configure{TITLE+}{Evaluation, Deployment and Monitoring of Models}

% ----------------------------------------------------------------- figures
% html/build.sh converts every PDF figure to SVG and writes its bounding box (.xbb)
\DeclareGraphicsExtensions{.svg,.png,.jpg}
% With TeX Live 2026, a TikZ node broken with \\ loops forever when colortbl (xcolor[table]) is
% loaded: its \everycr is not needed inside a picture.
\AddToHook{env/tikzpicture/begin}{\everycr{}}

% ------------------------------------------------------------- text styles
\Configure{emph}{\ifvmode\ShowPar\fi\HCode{<em>}\NoFonts}{\EndNoFonts\HCode{</em>}}
\Configure{textit}{\ifvmode\ShowPar\fi\HCode{<em>}\NoFonts}{\EndNoFonts\HCode{</em>}}
\Configure{textbf}{\ifvmode\ShowPar\fi\HCode{<strong>}\NoFonts}{\EndNoFonts\HCode{</strong>}}
\Configure{texttt}{\ifvmode\ShowPar\fi\HCode{<code>}\NoFonts}{\EndNoFonts\HCode{</code>}}

% -------------------------------------------------------------- navigation
\Configure{crosslinks}{}{}{Next →}{← Previous}{}{}{}{Up}
\Configure{crosslinks*}{prev}{up}{next}{}
% the contents are on the first page, next to the cover
\Configure{tableofcontents*}{chapter,likechapter,section,likesection}
\renewcommand{\tableofcontents}{}
\Configure{crosslinks+}
  {\ifvmode\IgnorePar\fi\EndP\HCode{<nav class="crosslinks top"><a class="home" href="index.html">Contents</a>}}
  {\HCode{</nav>}}
  {\ifvmode\IgnorePar\fi\EndP\HCode{<nav class="crosslinks bottom"><a class="home" href="index.html">Contents</a>}}
  {\HCode{</nav>}}

\makeatletter
% ------------------------------------------------------------------- cover
% the title page of the PDF is drawn with TikZ over the whole page: show the cover image instead
\RenewEnviron{titlepage}{\ifvmode\IgnorePar\fi\EndP
  \HCode{<div class="cover"><img src="cover.jpg" alt="Cover: Evaluation, Deployment and
    Monitoring of Models, by Cèsar Ferri, Carlos Monserrat, Yael Moros, Félix Martí,
    Daniel Romero-Alvarado and Fernando Martínez-Plumed" /></div>}}
\let\edm@copyrightpage\edmcopyrightpage
\renewcommand{\edmcopyrightpage}{\ifvmode\IgnorePar\fi\EndP\HCode{<div class="copyright">}\par\ShowPar
  \edm@copyrightpage\ifvmode\IgnorePar\fi\EndP\HCode{</div>}}

% ------------------------------------------------------------------- boxes
\newcommand{\edm@boxopen}[1]{\ifvmode\IgnorePar\fi\EndP
  \HCode{<aside class="box #1"><p class="box-title">}\leavevmode}
\newcommand{\edm@boxbody}{\HCode{</p>}\par\ShowPar}
\newcommand{\edm@boxclose}{\ifvmode\IgnorePar\fi\EndP\HCode{</aside>}\par}
\renewenvironment{keyidea}[1][]{\edm@boxopen{keyidea}Key idea\edm@boxbody}{\edm@boxclose}
\renewenvironment{pitfall}[1][]{\edm@boxopen{pitfall}Pitfall\edm@boxbody}{\edm@boxclose}
\renewenvironment{further}[1][]{\edm@boxopen{further}Going further\edm@boxbody}{\edm@boxclose}
\renewenvironment{objectives}[1][]{\edm@boxopen{objectives}Learning objectives\edm@boxbody}{\edm@boxclose}
% numbered boxes: \begin{example}{Title}{label} defines the label ex:label, as in the PDF
\newcounter{edmexample}[chapter]
\renewcommand{\theedmexample}{\thechapter.\arabic{edmexample}}
\crefname{edmexample}{Example}{Examples}\Crefname{edmexample}{Example}{Examples}
\newcounter{edmdefinition}[chapter]
\renewcommand{\theedmdefinition}{\thechapter.\arabic{edmdefinition}}
\crefname{edmdefinition}{Definition}{Definitions}\Crefname{edmdefinition}{Definition}{Definitions}
\RenewDocumentEnvironment{example}{m m}{\edm@boxopen{example}%
  \refstepcounter{edmexample}\label{ex:#2}Example~\theedmexample.\space#1\edm@boxbody}{\edm@boxclose}
\RenewDocumentEnvironment{definition}{m m}{\edm@boxopen{definition}%
  \refstepcounter{edmdefinition}\label{def:#2}Definition~\theedmdefinition.\space#1\edm@boxbody}{\edm@boxclose}

% ---------------------------------------------------------------- listings
% plain listings environments inside <figure>, with the numbering and labels of the PDF
\renewcommand{\edm@holdfloats}{}\renewcommand{\edm@releasefloats}{}
\newcounter{edmlisting}[chapter]
\renewcommand{\theedmlisting}{\thechapter.\arabic{edmlisting}}
\crefname{edmlisting}{Listing}{Listings}\Crefname{edmlisting}{Listing}{Listings}
\pgfkeys{/edm/listing/.cd,label/.code={\label{#1}},listing options/.code={\lstset{#1}}}
% (the arguments of \lstnewenvironment cannot contain \par, hence the helper macros)
\newcommand{\edm@listingopen}[2]{\ifvmode\IgnorePar\fi\EndP
  \HCode{<figure class="listing"><figcaption>}\leavevmode
  \refstepcounter{edmlisting}\pgfkeys{/edm/listing/.cd,#1}%
  \HCode{<span class="listing-number">}Listing~\theedmlisting\HCode{</span> }#2%
  \HCode{</figcaption>}\par\ShowPar}
\newcommand{\edm@outputopen}{\ifvmode\IgnorePar\fi\EndP
  \HCode{<figure class="output"><figcaption>Output</figcaption>}\par\ShowPar}
\newcommand{\edm@listingclose}{\ifvmode\IgnorePar\fi\EndP\HCode{</figure>}\par}
\let\pylisting\relax\let\endpylisting\relax
\lstnewenvironment{pylisting}[2][]{\lstset{style=pystyle}\edm@listingopen{#1}{#2}}{\edm@listingclose}
\let\pyoutput\relax\let\endpyoutput\relax
\lstnewenvironment{pyoutput}{\lstset{style=outstyle}\edm@outputopen}{\edm@listingclose}
\makeatother

\begin{document}
\EndPreamble
